[workspace]
members = [
    "crates/ot-parser",
    "crates/takoyaki-app",
]
resolver = "2"

[workspace.dependencies]
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
